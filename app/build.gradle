plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinabot.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sinabot.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // signed automatically with the debug keystore -> installable by sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
